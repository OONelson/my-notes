services:
  - type: web
    name: not-lify-api
    runtime: node
    rootDir: backend
    buildCommand: if [ -d backend ]; then cd backend; fi && npm install --include=dev && npx prisma generate && npm run build
    startCommand: if [ -d backend ]; then cd backend; fi && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
